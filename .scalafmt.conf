version = 3.11.1
runner.dialect=scala3
maxColumn = 120
indent.callSite = 2
indent.defnSite = 2
indent.ctorSite = 2
indent.extendSite = 2
align.preset = none
project.excludePaths = [ "glob:**/generated/**" ]

# The three settings below are the fleet's scalafmt POLICY — the same three
# platform and acumen carry, so every Scala repo here is formatted by one style
# rather than six. `dev fmt policy` reads this file off each repo's default
# branch and reports one that has drifted.
#
# Each is off its scalafmt default, and each default was measured against a real
# tree (ISS-1088) rather than assumed. Removing any of them re-arms a repo-wide
# rewrite of something a person wrote on purpose, and `scalafmtOnCompile := true`
# in build.sbt means that rewrite lands on the next compile rather than on a
# command somebody chose to run.

# Leave every trailing comma exactly as it was written. The default here is
# `never`, which DELETES the trailing comma from every multi-line parameter and
# argument list. Those commas are deliberate: they are what keeps adding one
# argument from showing up in a diff as two changed lines. The trade `keep` makes
# is that neither style is enforced on new code, which is the right way round --
# preserving what is written beats normalizing it.
rewrite.trailingCommas.style = keep

# Never re-wrap the prose inside a scaladoc. The default (`yes`) reflows comment
# bodies to `maxColumn`, which reads as harmless and is not: the scaladoc in
# these trees carries numbered lists, parameter tables and ASCII structure, and
# reflowing runs them together into a paragraph. Wrapping also escapes any `-`,
# `=` or `|` it pushes to the start of a line. The asterisk margin is still
# normalized, which is mechanical and leaves every word alone.
docstrings.wrap = no

# Leave hex literals cased as written: the default lowercases the digits, so
# `0xFEFF` becomes `0xfeff`. Same value, but it is still the formatter editing a
# token rather than moving it.
literals.hexDigits = Unchanged
